# Приложение + PostgreSQL. Перед первым запуском:
#   1. в корне проекта файл .env со строкой POSTGRES_PASSWORD=… (длинный случайный, только буквы и цифры: он идёт в DATABASE_URL);
#   2. backend/.env — ключи сервисов и хранилище файлов (STORAGE=s3 и S3_* для Yandex Object Storage);
#   3. docker compose up -d --build — миграции и каталог мест применятся при старте контейнера app.
# Проверить S3 локально: docker compose --profile minio up -d и в backend/.env
#   STORAGE=s3, S3_ENDPOINT=http://minio:9000, S3_REGION=us-east-1, S3_BUCKET=tripplan,
#   S3_ACCESS_KEY=minio, S3_SECRET_KEY=пароль MINIO_PASSWORD из .env.
# Перенос с прежнего сервера: docker compose run --rm -v /путь/к/var:/old app python manage.py sqlite-to-pg /old/trips.sqlite3
#   и files-to-s3 /old/uploads (или скопировать uploads в том app-data при STORAGE=local).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripplan
      POSTGRES_USER: tripplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplan -d tripplan"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://tripplan:${POSTGRES_PASSWORD}@db:5432/tripplan
      SH_DATA_DIR: /data
    volumes:
      - app-data:/data  # кеш Трипстера; файлы документов, если STORAGE=local
    ports:
      - "127.0.0.1:8000:8000"  # только для nginx на этой же машине
    depends_on:
      db:
        condition: service_healthy

  minio:
    profiles: [minio]
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio-password}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"  # консоль MinIO

  minio-init:
    profiles: [minio]
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minio $${MINIO_PASSWORD:-minio-password}; do sleep 1; done
      && mc mb --ignore-existing local/tripplan"
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minio-password}

volumes:
  pg-data:
  app-data:
  minio-data:
